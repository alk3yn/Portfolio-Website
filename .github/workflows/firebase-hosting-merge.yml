# This file was auto-generated by the Firebase CLI
# https://github.com/firebase/firebase-tools

name: Deploy to Firebase Hosting on merge
on:
  push:
    branches:
      - main

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Record build info
        run: |
          echo "Build: $(date -u +%Y-%m-%dT%H:%M:%SZ)" > .build-info.txt
          echo "Commit: ${{ github.sha }}" >> .build-info.txt
          cat .build-info.txt

      - name: Deploy to Firebase Hosting (live)
        # channelId: live tells the action to deploy straight to the live
        # site instead of creating a temporary preview channel.
        # continue-on-error only ignores the harmless "no changes to deploy"
        # case below — genuine failures still fail the job.
        id: deploy
        continue-on-error: true
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_TEJAS_AGRAWAL }}
          projectId: tejas-agrawal
          channelId: live
        env:
          FIREBASE_CLI_EXPERIMENTS: webframeworks
