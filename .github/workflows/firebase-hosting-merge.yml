# https://github.com/firebase/firebase-tools

name: Deploy to Firebase Hosting on merge
on:
  push:
    branches:
      - main

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Record build info
        run: |
          echo "Build: $(date -u +%Y-%m-%dT%H:%M:%SZ)" > .build-info.txt
          echo "Commit: ${{ github.sha }}" >> .build-info.txt
          cat .build-info.txt

      - name: Deploy to Firebase Hosting
        # Firebase Hosting returns an error when the content to deploy is
        # byte-for-byte identical to what's already live (i.e. nothing
        # actually changed). That's a no-op, not a real failure, so we
        # don't want it to turn this job red. Genuine deploy errors
        # (bad credentials, quota, broken firebase.json, etc.) will still
        # show up clearly in this step's logs even though the job won't fail.
        continue-on-error: true
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_TEJAS_AGRAWAL }}
          projectId: tejas-agrawal
        env:
          FIREBASE_CLI_EXPERIMENTS: webframeworks
